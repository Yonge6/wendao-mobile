<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="以马王堆帛书为主的生活实践型《道德经》阅读体验：原文、解释、与你有关。"
    />
    <meta name="theme-color" content="#f7f1e6" />
    <style>
      .wendao-boot{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;background:#f7f1e6;color:#123f46;font-family:"Songti SC","Noto Serif SC",serif;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));box-sizing:border-box;overflow:hidden}
      .wendao-boot::after{content:"";position:absolute;right:-14%;bottom:-10%;width:78%;height:38%;background:radial-gradient(ellipse at 50% 80%,rgba(18,63,70,.08),transparent 68%);filter:blur(10px);pointer-events:none}
      .wendao-boot__brand{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid rgba(181,127,30,.24);padding-bottom:14px;font-size:25px;letter-spacing:.06em}
      .wendao-boot__brand small{color:#a87417;font:9px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;letter-spacing:.2em}
      .wendao-boot__page{display:grid;align-content:center;gap:17px;width:min(560px,100%);margin:0 auto;padding-bottom:12vh}
      .wendao-boot__page span{color:#a87417;font:10px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;letter-spacing:.14em}
      .wendao-boot__page strong{font-size:clamp(28px,8vw,46px);font-weight:400;letter-spacing:.08em}
      .wendao-boot__line{height:1px;background:linear-gradient(90deg,rgba(181,127,30,.6),rgba(181,127,30,.08));transform-origin:left;animation:wendao-open 900ms ease-out both}
      .wendao-boot__copy{color:rgba(18,63,70,.58);font-size:13px;letter-spacing:.08em}
      @keyframes wendao-open{from{transform:scaleX(.18);opacity:.25}to{transform:scaleX(1);opacity:1}}
      @media(prefers-reduced-motion:reduce){.wendao-boot__line{animation:none}}
    </style>
    <script src="/analytics.js" defer></script>
    <script
      defer
      src="https://vibecafe.ai/telemetry/v1.js"

    <title>三慢问道 · 流动人生</title>
  </head>

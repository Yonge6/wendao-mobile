# Vercel recommended IPv4 addresses verified 2026-09-10.
# Use the verified custom host for SNI; the default vercel.app host is unreachable on the target network.
upstream wendao_ai_backend {
    server 216.198.79.1:443;
    server 64.29.17.1:443 backup;
    keepalive 8;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wendao.wonderelian.com;

    ssl_certificate /etc/letsencrypt/live/wonderelian.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wonderelian.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root $wonderelian_root;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Wendao-only API gateway. Validated Vercel custom-domain TLS is retained.
    location ^~ /api/ {
        proxy_pass https://wendao_ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host wendao-api.wonderelian.com;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_name wendao-api.wonderelian.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_verify_depth 3;
        proxy_connect_timeout 8s;
        proxy_read_timeout 75s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    location = /__wonderelian_health {
        access_log off;
        default_type text/plain;
        return 200 "wonderelian-alicloud-ok\n";
    }

    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|png|jpe?g|gif|webp|avif|svg|ico|mp3|m4a|aac|ogg|wav|mp4|webm)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
